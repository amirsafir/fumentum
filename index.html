<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FUMentum</title>

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Vazirmatn;
}

body{

background:#051633;
background-image:
radial-gradient(circle at top,#0b2e63 0,#051633 60%);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
padding:20px;

}

.card{

width:420px;
max-width:100%;
background:#071d3d;
border:1px solid rgba(255,196,0,.35);
border-radius:30px;
padding:40px;
text-align:center;
box-shadow:0 0 40px rgba(255,196,0,.12);

}

.logo{

font-size:42px;
font-weight:800;
color:#FFC400;

}

.subtitle{

color:#d8d8d8;
margin-top:10px;
margin-bottom:35px;
font-size:18px;

}

.btn{

display:block;
text-decoration:none;
margin:16px 0;
padding:18px;
border-radius:18px;
font-size:20px;
font-weight:700;
transition:.25s;
color:white;
border:1px solid rgba(255,196,0,.35);

}

.telegram{

background:#229ED9;

}

.instagram{

background:linear-gradient(45deg,#833ab4,#fd1d1d,#fcb045);

}

.bale{

background:#0DBE64;

}

.btn:hover{

transform:translateY(-4px);
box-shadow:0 12px 30px rgba(255,196,0,.18);

}

.footer{

margin-top:35px;
font-size:14px;
color:#bdbdbd;

}

</style>

</head>

<body>

<div class="card">

<div class="logo">
FUMentum
</div>

<div class="subtitle">
رصد بازارهای مالی
</div>

<a class="btn telegram"
href="https://t.me/FUMentum">
📨 تلگرام
</a>

<a class="btn instagram"
href="https://instagram.com/fum.entum">
📷 اینستاگرام
</a>

<a class="btn bale"
href="https://ble.ir/FUMentum">
💬 بله
</a>

<div class="footer">
دانش امروز، تصمیم فردا
</div>

</div>

</body>
</html>
